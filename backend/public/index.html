<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/format.js"></script>
  <script src="js/brand.js"></script>
</head>
<body>
<div id="login-screen" hidden>
  <form class="login-card" id="login-form" novalidate>
    <img data-brand-logo class="brand-logo" alt="" hidden />
    <h1 id="login-title" data-brand="companyName">Sign in</h1>
    <p class="slogan" id="login-slogan" data-brand="companySlogan">Sign in to your dashboard</p>
    <div id="error-msg" class="notice error" hidden></div>
    <div id="demo-hint" class="notice info" hidden></div>
    <label for="email-input" class="sr-only">Email address</label>
    <input type="email" id="email-input" placeholder="Email address" autocomplete="username" required />
    <label for="password-input" class="sr-only">Password</label>
    <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" required />
    <button class="btn btn-primary btn-block" type="submit" id="btn-login">Sign In</button>
    <div id="google-block" hidden>
      <div class="divider">or</div>
      <a class="btn btn-outline btn-block" href="/api/auth/google" id="btn-google">Continue with Google</a>
    </div>
  </form>
</div>
<div id="app" hidden>
  <nav id="topnav"></nav>
  <main>
    <div class="page-header"><h2>Dashboard</h2></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Open Jobs</div><div class="value" id="stat-open">&hellip;</div></div>
      <div class="stat-card"><div class="label">Scheduled Today</div><div class="value" id="stat-today">&hellip;</div></div>
      <div class="stat-card"><div class="label">Completed This Month</div><div class="value" id="stat-completed">&hellip;</div></div>
      <div class="stat-card"><div class="label" id="stat-4-label">Unpaid Invoices</div><div class="value" id="stat-unpaid">&hellip;</div></div>
    </div>
    <div class="card">
      <div class="card-header">
        <h3>Recent Jobs</h3>
        <a class="btn btn-sm" href="dispatch.html">View All</a>
      </div>
      <table class="responsive">
        <thead><tr><th>#</th><th>Customer</th><th>Job</th><th data-tech-label>Technician</th><th>Status</th><th>Scheduled</th></tr></thead>
        <tbody id="jobs-tbody"><tr><td colspan="6" class="empty">Loading&hellip;</td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/index.js"></script>
</body>
</html>
