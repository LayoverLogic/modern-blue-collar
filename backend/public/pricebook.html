<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricebook</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/format.js"></script>
  <script src="js/brand.js"></script>
</head>
<body>
<nav id="topnav"></nav>
<main>
  <div class="page-header">
    <h2 id="page-title">Pricebook</h2>
    <div class="page-actions"><button class="btn btn-primary" type="button" id="btn-new" data-roles="admin" hidden>+ Add Item</button></div>
  </div>
  <div class="filters">
    <input type="search" id="search-input" placeholder="Search items&hellip;" aria-label="Search items" />
    <select id="category-filter" aria-label="Category"><option value="">All categories</option></select>
  </div>
  <div class="card">
    <table class="responsive">
      <thead><tr><th>Item</th><th>Category</th><th>Description</th><th class="num">Price</th><th>Unit</th><th data-roles="admin" hidden></th></tr></thead>
      <tbody id="items-tbody"><tr><td colspan="6" class="empty">Loading&hellip;</td></tr></tbody>
    </table>
  </div>
</main>

<div class="modal-overlay" id="modal">
  <form class="modal" id="item-form" novalidate>
    <h3 id="modal-title">Add Pricebook Item</h3>
    <div class="form-group"><label for="f-name">Name *</label><input type="text" id="f-name" required /></div>
    <div class="form-group"><label for="f-category">Category *</label><input type="text" id="f-category" list="category-list" placeholder="e.g. Labor, Parts, Service" required /><datalist id="category-list"></datalist></div>
    <div class="form-group"><label for="f-desc">Description</label><textarea id="f-desc"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label for="f-price">Price *</label><input type="number" id="f-price" step="0.01" min="0" required /></div>
      <div class="form-group"><label for="f-unit">Unit</label><input type="text" id="f-unit" placeholder="each, hr, ft" /></div>
    </div>
    <div id="modal-error" class="form-error" hidden></div>
    <div class="modal-footer">
      <button class="btn btn-danger" type="button" id="btn-archive" hidden>Archive</button>
      <button class="btn btn-outline" type="button" data-close-modal>Cancel</button>
      <button class="btn btn-primary" type="submit" id="btn-save">Save Item</button>
    </div>
  </form>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/pricebook.js"></script>
</body>
</html>
