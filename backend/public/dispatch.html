<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dispatch</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/format.js"></script>
  <script src="js/brand.js"></script>
</head>
<body>
<nav id="topnav"></nav>
<main>
  <div class="page-header">
    <h2>Dispatch Board</h2>
    <div class="page-actions">
      <button class="btn btn-outline" type="button" id="btn-export" data-roles="admin" hidden>Export CSV</button>
      <button class="btn btn-primary" type="button" id="btn-new">+ New Job</button>
    </div>
  </div>
  <div class="filters">
    <select id="status-filter" aria-label="Status">
      <option value="">All statuses</option>
      <option value="open">Open (not finished)</option>
      <option value="pending">Pending</option>
      <option value="scheduled">Scheduled</option>
      <option value="in-progress">In progress</option>
      <option value="completed">Completed</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <select id="tech-filter" aria-label="Technician"><option value="">All</option></select>
    <select id="type-filter" aria-label="Job type"><option value="">All types</option></select>
    <input type="search" id="search-input" placeholder="Search customer, title or notes&hellip;" aria-label="Search jobs" />
  </div>
  <div class="card">
    <table class="responsive">
      <thead><tr><th>#</th><th>Customer</th><th>Job</th><th data-tech-label>Technician</th><th>Status</th><th>Scheduled</th><th>Priority</th></tr></thead>
      <tbody id="jobs-tbody"><tr><td colspan="7" class="empty">Loading&hellip;</td></tr></tbody>
    </table>
  </div>
</main>

<div class="modal-overlay" id="modal">
  <form class="modal" id="job-form" novalidate>
    <h3>New Job</h3>
    <div class="form-group"><label for="f-customer">Customer *</label><select id="f-customer" required><option value="">Select customer&hellip;</option></select></div>
    <div class="form-row">
      <div class="form-group"><label for="f-type">Job type *</label><select id="f-type" required></select></div>
      <div class="form-group"><label for="f-priority">Priority</label>
        <select id="f-priority"><option value="normal">Normal</option><option value="low">Low</option><option value="high">High</option><option value="urgent">Urgent</option></select></div>
    </div>
    <div class="form-group"><label for="f-title">Title *</label><input type="text" id="f-title" placeholder="e.g. Leaking outside tap" required /></div>
    <div class="form-group"><label for="f-tech" data-tech-label>Technician</label><select id="f-tech"><option value="">Unassigned</option></select></div>
    <div class="form-row three">
      <div class="form-group"><label for="f-date">Date</label><input type="date" id="f-date" /></div>
      <div class="form-group"><label for="f-time">Time</label><input type="time" id="f-time" step="900" /></div>
      <div class="form-group"><label for="f-duration">Hours</label><input type="number" id="f-duration" min="0.25" step="0.25" value="1.5" /></div>
    </div>
    <div class="form-group"><label for="f-notes">Description / notes</label><textarea id="f-notes" placeholder="What does the customer need?"></textarea></div>
    <div id="modal-error" class="form-error" hidden></div>
    <div class="modal-footer">
      <button class="btn btn-outline" type="button" data-close-modal>Cancel</button>
      <button class="btn btn-primary" type="submit" id="btn-save">Create Job</button>
    </div>
  </form>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/dispatch.js"></script>
</body>
</html>
