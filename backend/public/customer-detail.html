<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/format.js"></script>
  <script src="js/brand.js"></script>
</head>
<body>
<nav id="topnav"></nav>
<main>
  <a href="customers.html" class="back-link">&larr; Back to Customers</a>
  <div id="customer-content" hidden>
    <div class="page-header">
      <div><h2 id="customer-name">Customer</h2><div class="muted small" id="customer-contact" hidden></div></div>
      <div class="action-bar">
        <a class="btn" id="btn-new-job" href="dispatch.html">+ New Job</a>
        <a class="btn btn-outline" id="btn-call" href="#">Call</a>
        <a class="btn btn-outline" id="btn-text" href="#">Text</a>
        <a class="btn btn-outline" id="btn-comms" href="communications.html">Communications</a>
      </div>
    </div>
    <div class="grid-2">
      <div>
        <form class="card pad" id="edit-form" novalidate>
          <h3>Contact Info</h3>
          <div class="form-group"><label for="e-company">Company</label><input type="text" id="e-company" autocomplete="organization" placeholder="Leave blank for a household" /></div>
          <div class="form-row">
            <div class="form-group"><label for="e-first">First name</label><input type="text" id="e-first" /></div>
            <div class="form-group"><label for="e-last">Last name</label><input type="text" id="e-last" /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label for="e-phone">Phone</label><input type="tel" id="e-phone" /></div>
            <div class="form-group"><label for="e-email">Email</label><input type="email" id="e-email" /></div>
          </div>
          <div class="form-group"><label for="e-address" id="l-address">Street address</label><input type="text" id="e-address" /></div>
          <div class="form-group"><label for="e-address2" id="l-address2">Address line 2</label><input type="text" id="e-address2" /></div>
          <div class="form-row three">
            <div class="form-group"><label for="e-city" id="l-city">Town / City</label><input type="text" id="e-city" /></div>
            <div class="form-group"><label for="e-state" id="l-state">Region</label><input type="text" id="e-state" /></div>
            <div class="form-group"><label for="e-zip" id="l-zip">Postcode</label><input type="text" id="e-zip" /></div>
          </div>
          <div class="form-group"><label for="e-notes">Notes</label><textarea id="e-notes"></textarea></div>
          <div id="edit-error" class="form-error" hidden></div>
          <button class="btn btn-primary" type="submit" id="btn-save">Save Changes</button>
        </form>
        <div class="card pad">
          <h3>Stats</h3>
          <div class="info-row"><span class="info-label">Total jobs</span><span class="info-value" id="stat-jobs">&hellip;</span></div>
          <div class="info-row"><span class="info-label">Open jobs</span><span class="info-value" id="stat-open">&hellip;</span></div>
          <div class="info-row"><span class="info-label">Total invoiced</span><span class="info-value" id="stat-invoiced">&hellip;</span></div>
        </div>
      </div>
      <div>
        <div class="card">
          <h3>Job History</h3>
          <table class="responsive">
            <thead><tr><th>#</th><th>Job</th><th data-tech-label>Technician</th><th>Status</th><th>Scheduled</th></tr></thead>
            <tbody id="jobs-tbody"></tbody>
          </table>
        </div>
        <div class="card">
          <h3>Invoices</h3>
          <table class="responsive">
            <thead><tr><th>Number</th><th>Job</th><th>Status</th><th class="num">Total</th><th>Due</th></tr></thead>
            <tbody id="invoices-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <div id="loading-msg" class="empty">Loading customer&hellip;</div>
  <div id="error-msg" class="empty error-text" hidden>Customer not found.</div>
</main>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/customer-detail.js"></script>
</body>
</html>
