<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Communications</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/format.js"></script>
  <script src="js/brand.js"></script>
</head>
<body>
<nav id="topnav"></nav>
<main>
  <div class="page-header">
    <h2 id="page-title">Communications</h2>
    <div class="page-actions"><button class="btn btn-primary" type="button" id="btn-new">+ Log Communication</button></div>
  </div>
  <div class="filters">
    <select id="customer-filter" aria-label="Customer"><option value="">All customers (recent)</option></select>
    <select id="type-filter" aria-label="Type">
      <option value="">All types</option>
      <option value="call">Calls</option>
      <option value="email">Emails</option>
      <option value="text">Texts</option>
      <option value="note">Notes</option>
      <option value="quote">Quotes</option>
      <option value="invoice">Invoices</option>
    </select>
  </div>
  <div class="timeline" id="timeline"><div class="card"><div class="empty">Loading&hellip;</div></div></div>
</main>

<div class="modal-overlay" id="modal">
  <form class="modal" id="comm-form" novalidate>
    <h3>Log Communication</h3>
    <div class="form-group"><label for="f-customer">Customer *</label><select id="f-customer" required></select></div>
    <div class="form-row">
      <div class="form-group"><label for="f-type">Type</label>
        <select id="f-type"><option value="call">Call</option><option value="email">Email</option><option value="text">Text</option><option value="note">Note</option></select></div>
      <div class="form-group"><label for="f-direction">Direction</label>
        <select id="f-direction"><option value="outbound">Outbound</option><option value="inbound">Inbound</option></select></div>
    </div>
    <div class="form-group"><label for="f-subject">Subject</label><input type="text" id="f-subject" placeholder="Summary" /></div>
    <div class="form-group"><label for="f-body">Details</label><textarea id="f-body"></textarea></div>
    <div id="modal-error" class="form-error" hidden></div>
    <div class="modal-footer">
      <button class="btn btn-outline" type="button" data-close-modal>Cancel</button>
      <button class="btn btn-primary" type="submit" id="btn-save">Save</button>
    </div>
  </form>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/communications.js"></script>
</body>
</html>
