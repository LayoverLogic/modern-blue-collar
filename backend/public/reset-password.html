<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Reset password</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/format.js"></script>
  <script src="js/brand.js"></script>
</head>
<body>
<main class="auth-screen">
  <div class="login-card auth-card">
    <img data-brand-logo class="brand-logo" alt="" hidden />
    <h1 id="rp-title">Reset your password</h1>
    <p class="slogan" id="rp-status">Checking your link&hellip;</p>
    <form id="rp-form" novalidate hidden>
      <input type="text" class="sr-only" autocomplete="username" tabindex="-1" aria-hidden="true" id="rp-username" />
      <div class="form-group"><label for="rp-new" id="l-rp-new">New password</label><input type="password" id="rp-new" autocomplete="new-password" required /></div>
      <div class="form-group"><label for="rp-confirm">New password again</label><input type="password" id="rp-confirm" autocomplete="new-password" required /></div>
      <div id="rp-error" class="notice error" hidden></div>
      <button class="btn btn-primary btn-block" type="submit" id="btn-rp-save">Set new password</button>
    </form>
    <div id="rp-done" class="notice ok" hidden></div>
    <div id="rp-bad" class="notice error" hidden></div>
    <div class="field-actions" id="rp-links">
      <a class="btn btn-outline btn-block" href="index.html" id="rp-signin">Back to sign in</a>
      <a class="btn btn-outline btn-block" href="index.html#forgot" id="rp-again" hidden>Send me a new link</a>
    </div>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/reset-password.js"></script>
</body>
</html>
