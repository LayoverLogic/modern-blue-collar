<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/format.js"></script>
  <script src="js/brand.js"></script>
</head>
<body>
<nav id="topnav"></nav>
<main>
  <div class="page-header">
    <h2>Customers</h2>
    <div class="page-actions">
      <button class="btn btn-outline" type="button" id="btn-export" data-roles="admin" hidden>Export CSV</button>
      <button class="btn btn-primary" type="button" id="btn-new">+ New Customer</button>
    </div>
  </div>
  <div class="filters">
    <input type="search" id="search-input" placeholder="Search by name, phone, email, address&hellip;" aria-label="Search customers" />
    <select id="region-filter" aria-label="Filter by region"><option value="">All areas</option></select>
  </div>
  <div class="card">
    <table class="responsive">
      <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th class="num">Jobs</th></tr></thead>
      <tbody id="customers-tbody"><tr><td colspan="5" class="empty">Loading&hellip;</td></tr></tbody>
    </table>
  </div>
</main>

<div class="modal-overlay" id="modal">
  <form class="modal" id="customer-form" novalidate>
    <h3>New Customer</h3>
    <div class="form-row">
      <div class="form-group"><label for="f-first">First name *</label><input type="text" id="f-first" autocomplete="off" required /></div>
      <div class="form-group"><label for="f-last">Last name *</label><input type="text" id="f-last" autocomplete="off" required /></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label for="f-phone">Phone *</label><input type="tel" id="f-phone" required /></div>
      <div class="form-group"><label for="f-email">Email</label><input type="email" id="f-email" /></div>
    </div>
    <div class="form-group"><label for="f-address">Street address *</label><input type="text" id="f-address" required /></div>
    <div class="form-row three">
      <div class="form-group"><label for="f-city">Town / City *</label><input type="text" id="f-city" required /></div>
      <div class="form-group"><label for="f-state" id="l-state">State</label><input type="text" id="f-state" /></div>
      <div class="form-group"><label for="f-zip" id="l-zip">ZIP *</label><input type="text" id="f-zip" required /></div>
    </div>
    <div class="form-group"><label for="f-type">Type</label>
      <select id="f-type"><option value="residential">Residential</option><option value="commercial">Commercial</option><option value="industrial">Industrial</option></select>
    </div>
    <div class="form-group"><label for="f-notes">Notes</label><input type="text" id="f-notes" /></div>
    <div id="modal-error" class="form-error" hidden></div>
    <div class="modal-footer">
      <button class="btn btn-outline" type="button" data-close-modal>Cancel</button>
      <button class="btn btn-primary" type="submit" id="btn-save">Create Customer</button>
    </div>
  </form>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/customers.js"></script>
</body>
</html>
