<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quotes &amp; Invoices</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/format.js"></script>
  <script src="js/brand.js"></script>
</head>
<body>
<nav id="topnav"></nav>
<main>
  <div class="page-header">
    <h2>Quotes &amp; Invoices</h2>
    <div class="page-actions">
      <button class="btn btn-outline" type="button" id="btn-export">Export invoices CSV</button>
      <button class="btn btn-primary" type="button" id="btn-new-quote">+ New Quote</button>
    </div>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><div class="label">Open quotes</div><div class="value" id="s-quotes">&hellip;</div></div>
    <div class="stat-card"><div class="label">Unpaid</div><div class="value" id="s-unpaid">&hellip;</div></div>
    <div class="stat-card"><div class="label">Paid this month</div><div class="value" id="s-paid">&hellip;</div></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab active" type="button" data-tab="quotes">Quotes</button>
    <button class="tab" type="button" data-tab="invoices">Invoices</button>
  </div>
  <div class="filters">
    <input type="search" id="search-input" placeholder="Search customer, job or #&hellip;" aria-label="Search" />
    <select id="status-filter" aria-label="Status"><option value="">All statuses</option></select>
  </div>
  <div class="card">
    <table class="responsive">
      <thead id="table-head"></thead>
      <tbody id="list-tbody"><tr><td colspan="6" class="empty">Loading&hellip;</td></tr></tbody>
    </table>
  </div>
</main>

<div class="modal-overlay" id="modal">
  <form class="modal" id="new-quote-form" novalidate>
    <h3>New Quote</h3>
    <p class="muted small">Quotes are built on the job page from your pricebook. Choose the job to quote:</p>
    <div class="form-group"><label for="f-job">Job without a quote</label><select id="f-job"></select></div>
    <div id="modal-error" class="form-error" hidden></div>
    <div class="modal-footer">
      <button class="btn btn-outline" type="button" data-close-modal>Cancel</button>
      <button class="btn btn-primary" type="submit">Open quote builder</button>
    </div>
  </form>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/quote-invoice.js"></script>
</body>
</html>
