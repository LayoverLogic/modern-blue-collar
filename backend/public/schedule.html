<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/format.js"></script>
  <script src="js/brand.js"></script>
</head>
<body>
<nav id="topnav"></nav>
<main>
  <div class="page-header">
    <h2>Schedule</h2>
    <div class="controls">
      <div class="view-toggle" role="group" aria-label="View">
        <button type="button" data-view="day" id="btn-day">Day</button>
        <button type="button" data-view="week" id="btn-week" class="active">Week</button>
        <button type="button" data-view="month" id="btn-month">Month</button>
      </div>
      <button class="btn btn-outline" type="button" id="btn-prev" aria-label="Previous">&larr;</button>
      <span class="nav-label" id="nav-label"></span>
      <button class="btn btn-outline" type="button" id="btn-next" aria-label="Next">&rarr;</button>
      <button class="btn btn-outline" type="button" id="btn-today">Today</button>
      <label for="date-picker" class="sr-only">Jump to date</label>
      <input type="date" id="date-picker" />
    </div>
  </div>
  <div class="filters" id="filter-row">
    <select id="tech-filter" aria-label="Technician"><option value="">All</option></select>
  </div>
  <div id="calendar-container"></div>
</main>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/schedule.js"></script>
</body>
</html>
