<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Keys</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/format.js"></script>
  <script src="js/brand.js"></script>
</head>
<body>
<nav id="topnav"></nav>
<main>
  <div class="page-header">
    <h2>API Keys</h2>
    <div class="page-actions"><button class="btn btn-primary" type="button" id="btn-new">+ New API Key</button></div>
  </div>
  <div class="notice info">
    API keys let other systems (accounting, messaging, point of sale) connect to this platform. Send the key in the
    <strong>X-API-Key</strong> header. A key is shown only once, when it is created &mdash; store it safely.
  </div>
  <div class="card">
    <table class="responsive">
      <thead><tr><th>Name</th><th>Prefix</th><th>Scopes</th><th>Status</th><th>Last used</th><th>Created</th><th></th></tr></thead>
      <tbody id="keys-tbody"><tr><td colspan="7" class="empty">Loading&hellip;</td></tr></tbody>
    </table>
  </div>
</main>

<div class="modal-overlay" id="create-modal">
  <form class="modal" id="key-form" novalidate>
    <h3>Create API Key</h3>
    <div class="form-group"><label for="f-name">Name / label *</label><input type="text" id="f-name" placeholder="e.g. Accounting sync" required /></div>
    <div class="form-row">
      <div class="form-group"><label for="f-scopes">Scopes</label>
        <select id="f-scopes"><option value="read,write">Read &amp; write</option><option value="read">Read only</option></select></div>
      <div class="form-group"><label for="f-expires">Expires (optional)</label><input type="date" id="f-expires" /></div>
    </div>
    <div id="modal-error" class="form-error" hidden></div>
    <div id="key-result"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" type="button" data-close-modal>Close</button>
      <button class="btn btn-primary" type="submit" id="btn-create">Create Key</button>
    </div>
  </form>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/api-keys.js"></script>
</body>
</html>
