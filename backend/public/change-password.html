<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a new password</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/format.js"></script>
  <script src="js/brand.js"></script>
</head>
<body>
<main class="auth-screen">
  <form class="login-card auth-card" id="cp-form" novalidate hidden>
    <img data-brand-logo class="brand-logo" alt="" hidden />
    <h1>Choose a new password</h1>
    <p class="slogan" id="cp-intro">Your account has a temporary password. Choose your own before you continue.</p>
    <input type="text" class="sr-only" autocomplete="username" tabindex="-1" aria-hidden="true" id="cp-username" />
    <div class="form-group"><label for="cp-current" id="l-cp-current">Temporary password</label><input type="password" id="cp-current" autocomplete="current-password" required /></div>
    <div class="form-group"><label for="cp-new" id="l-cp-new">New password</label><input type="password" id="cp-new" autocomplete="new-password" required /></div>
    <div class="form-group"><label for="cp-confirm">New password again</label><input type="password" id="cp-confirm" autocomplete="new-password" required /></div>
    <div id="cp-error" class="notice error" hidden></div>
    <button class="btn btn-primary btn-block" type="submit" id="btn-cp-save">Save new password</button>
    <div class="field-actions"><button class="link-button" type="button" id="btn-cp-signout">Sign out instead</button></div>
  </form>
</main>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/change-password.js"></script>
</body>
</html>
