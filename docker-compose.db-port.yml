# Optional override: publish Postgres on the HOST's loopback only, for psql /
# GUI debugging during local development. Never use this in production.
#
#   docker compose -f docker-compose.yml -f docker-compose.db-port.yml --profile demo up
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
